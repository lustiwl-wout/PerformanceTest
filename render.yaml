# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy with: connect this repo in the Render dashboard ("New" -> "Blueprint").
services:
  - type: web
    name: proxy-performance-tester
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set the Neon/PostgreSQL connection string in the Render dashboard.
      # sync: false keeps the secret out of this repo.
      - key: DATABASE_URL
        sync: false
